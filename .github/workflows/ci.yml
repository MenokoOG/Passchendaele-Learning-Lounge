name: ci

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      # Test-only values. Not secrets.
      JWT_SECRET: ci-test-secret-0123456789abcdef0123456789
      TEST_MONGO_URI: mongodb://localhost:27017/test-db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Server typecheck
        run: server/node_modules/.bin/tsc -p server --noEmit
      - name: Server tests
        run: pnpm --filter ./server run test
      - name: Classroom build
        run: pnpm --filter ./classroom run build
